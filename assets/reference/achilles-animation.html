<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>跟腱受拉与断裂</title><style>body{margin:0;background:#faf9f5;color:#17243c;font-family:system-ui;text-align:center}.frame{max-width:430px;aspect-ratio:1;margin:auto;background-image:url(achilles-stages.png);background-size:300% 100%;background-position:0% 0}h2{font-size:23px;margin:12px}p{line-height:1.6;margin:10px 20px}button{padding:10px 14px;margin:4px;border:1px solid #ddd;border-radius:10px;background:white;color:#17243c;cursor:pointer}button[aria-pressed=true]{background:#17243c;color:white}.quiet{font-size:12px;color:#697481}</style><div class="frame" role="img" aria-label="跟腱完整连接"></div><h2 id="title"></h2><p id="description"></p><div><button data-stage="0">完整</button><button data-stage="1">受拉</button><button data-stage="2">断裂</button><button id="play">暂停</button></div><p class="quiet">受拉不等于断裂。图示为负荷超过承受能力的一种情况，断口作了放大。<br>这是分阶段示意，不是动作教学；重播不代表自行愈合。</p><script>
const stages=[['完整连接','跟腱连接小腿肌肉与跟骨，帮助传递力量。'],['运动中受拉','脚向背屈方向移动时，跟腱会受拉；正常活动并不意味着会断裂。'],['负荷超出承受能力后断裂','部分或全部纤维断开；这里展示完全断裂，断端出现分离。']];let stage=0,playing=true;function show(n){stage=n;document.querySelector('.frame').style.backgroundPosition=(n*50)+'% 0';document.querySelector('.frame').setAttribute('aria-label',stages[n][0]);document.querySelector('#title').textContent=stages[n][0];document.querySelector('#description').textContent=stages[n][1];document.querySelectorAll('[data-stage]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.stage)===n));}document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{playing=false;document.querySelector('#play').textContent='播放';show(Number(b.dataset.stage));});document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放';};if(matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;document.querySelector('#play').textContent='播放';}setInterval(()=>{if(playing)show((stage+1)%3)},2800);show(0);
</script></html>
